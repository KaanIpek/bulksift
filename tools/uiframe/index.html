<!doctype html>
<html><head><meta charset="utf-8"><title>BulkSift phone frame</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0c;
            font-family:-apple-system,system-ui,sans-serif}
  #w{display:flex;gap:20px;align-items:center;justify-content:center;height:100%}
  .slot{transform-origin:center center}
  .phone{width:390px;height:844px;border-radius:44px;overflow:hidden;border:8px solid #16181d;
         box-shadow:0 24px 70px rgba(0,0,0,.7);background:#000}
  iframe{width:390px;height:844px;border:0;display:block}
</style></head>
<body>
  <div id="w"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const n = Number(q.get('n') || 1);
    const w = document.getElementById('w');
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'slot';
      d.innerHTML = '<div class="phone"><iframe src="http://localhost:8081/"></iframe></div>';
      w.appendChild(d);
    }
    function fit() {
      const k = Math.min((innerHeight - 24) / 860, (innerWidth - 40) / (n * 410));
      for (const s of document.querySelectorAll('.slot')) s.style.transform = 'scale(' + k + ')';
      const gap = -410 * (1 - k) + 20;
      w.style.gap = gap + 'px';
    }
    addEventListener('resize', fit);
    new ResizeObserver(fit).observe(document.documentElement);
    fit();
  </script>
</body></html>
